version: 2
project_name: lu-cleaner

before:
  hooks:
    - go mod tidy

builds:
  - id: lu-cleaner
    main: ./cmd/lu-cleaner
    binary: lu-cleaner
    # cgo: the persistent size cache replays the FSEvents history
    # (internal/fsevents, CoreServices). Both architectures build on the
    # arm64 macOS runner with the Xcode clang: for darwin cgo builds the go
    # command passes `-arch x86_64` / `-arch arm64` to it itself. Without
    # MACOSX_DEPLOYMENT_TARGET the external link would require the runner's
    # macOS version; 12.0 is Go's minimum.
    env:
      - CGO_ENABLED=1
      - CC=clang
      - MACOSX_DEPLOYMENT_TARGET=12.0
    goos: [darwin]
    goarch: [arm64, amd64]
    ldflags:
      # The public DSN is optional; a missing value keeps reporting unavailable.
      - -s -w -X main.version={{ .Version }} {{ if .Env.LU_DIAGNOSTICS_DSN }}-X github.com/ludwig-pro/lu-cleaner/internal/cli.DefaultDiagnosticsDSN={{ .Env.LU_DIAGNOSTICS_DSN }}{{ end }}

universal_binaries:
  - replace: true

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_macOS_universal'
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:']
