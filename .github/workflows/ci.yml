name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: make build && ./bin/lu-cleaner --version
      - name: generated docs are up to date
        run: |
          make docs
          git diff --exit-code -- site/src/content/docs/reference || (echo "Run 'make docs' and commit the result"; exit 1)
